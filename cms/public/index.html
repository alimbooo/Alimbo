<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>پنل مدیریت محتوا</title><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --card: #1e1e1e; }
body { font-family: Tahoma, Arial, sans-serif; background: var(--background, #161616); color: var(--foreground, #f0f0f0); line-height: 1.8; }
.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.sidebar { background: var(--card); border-left: 1px solid var(--border, #263243); padding: 24px 16px; display: flex; flex-direction: column; justify-content: space-between; }
.sidebar h1 { font-size: 1.1rem; color: var(--primary, #b8f542); }
.theme-toggle { display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--foreground); cursor:pointer; transition:filter .2s, color .2s; }
.theme-toggle:hover { filter:brightness(1.2); color:var(--primary); }
.theme-toggle svg { width:20px; height:20px; }
.theme-toggle .icon-sun { display:none; }
:root[data-theme="light"] .theme-toggle .icon-sun { display:block; }
:root[data-theme="light"] .theme-toggle .icon-moon { display:none; }
.nav-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; color: var(--muted, #9ba6b5); cursor: pointer; margin-bottom: 4px; border: none; background: none; width: 100%; text-align: right; font: inherit; }
.nav-item:hover, .nav-item.active { background: var(--card); filter: brightness(1.2); color: var(--foreground, #f5f7fa); }
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
.nav-group { margin-bottom: 4px; }
.nav-group-toggle { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 8px; color: var(--muted, #9ba6b5); cursor: pointer; border: none; background: none; width: 100%; text-align: right; font: inherit; }
.nav-group-toggle:hover { background: var(--card); filter: brightness(1.2); color: var(--foreground, #f5f7fa); }
.nav-group-toggle .nav-group-label { display: flex; align-items: center; gap: 8px; }
.nav-group-toggle svg { width: 16px; height: 16px; flex-shrink: 0;}
.nav-group-arrow { width: 14px; height: 14px; transition: transform 0.2s; flex-shrink: 0; }
.nav-group.open .nav-group-arrow { transform: rotate(-90deg); }
.nav-group-children { display: none; padding-right: 28px; }
.nav-group.open .nav-group-children { display: block; }
.nav-child { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; color: var(--muted, #9ba6b5); cursor: pointer; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: right; font: inherit; font-size: .9rem; }
.nav-child:hover, .nav-child.active { background: var(--card); filter: brightness(1.2); color: var(--foreground, #f5f7fa); }
.main { padding: 32px 48px; max-width: 1400px; min-width: 1250px; margin: 0 auto; overflow-x: hidden; }
.main h2 { font-size: 1.8rem; margin-bottom: 8px; }
.main p.sub { color: var(--muted, #9ba6b5); margin-bottom: 24px; }
.card { background: var(--card); border: 1px solid var(--border, #263243); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
label { display: block; margin: 12px 0 4px; color: var(--muted, #9ba6b5); font-size: .85rem; }
input, select, textarea { width: 100%; background: var(--background, #0b111b); border: 1px solid var(--border, #263243); color: var(--foreground, #f5f7fa); border-radius: 8px; padding: 10px 12px; font: inherit; }
textarea { min-height: 120px; resize: vertical; }
.btn { background: var(--primary, #b8f542); color: var(--background, #0b111b); border: none; border-radius: 8px; padding: 10px 18px; cursor: pointer; font-weight: 700; font: inherit; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { opacity: .9; }
.btn.sec { background: transparent; color: var(--foreground, #f5f7fa); border: 1px solid var(--border, #263243); }
.btn.danger { background: #ef4444; color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.github { background: #333; color: #fff; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
.list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid var(--border, #263243); border-radius: 8px; margin-bottom: 8px; }
.tag { background: var(--border, #17303b); color: var(--accent, #8adcf0); border-radius: 999px; padding: 2px 10px; font-size: .78rem; }
.msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; }
.msg.ok { background: var(--background, #15231b); border: 1px solid var(--primary, #b8f542); color: var(--primary, #b8f542); }
.msg.err { background: var(--background, #2a1515); border: 1px solid #ef4444; color: #ef4444; }
img.preview { max-width: 100px; max-height: 100px; border-radius: 8px; border: 1px solid var(--border, #263243); }
hr { border: none; border-top: 1px solid var(--border, #263243); margin: 16px 0; }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.modal-content { background: var(--card); padding: 24px; border-radius: 12px; width: 90%; max-width: 800px; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border, #263243); }
.modal-content > *:not(#media-modal-grid) { flex-shrink: 0; }
#media-modal-grid { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 4px; margin: 12px 0; }
.modal-close { display: block; margin-bottom: 12px; background: none; border: none; color: #fff; cursor: pointer; font-size: 1.2rem; }
.lightbox-img { max-width: 90%; max-height: 90vh; border-radius: 8px; border: 1px solid #263243; object-fit: contain; }
@media (max-width: 768px) { .app { grid-template-columns: 1fr; } .sidebar { border-left: none; border-bottom: 1px solid #263243; } .grid2 { grid-template-columns: 1fr; } }

input[type="file"]::file-selector-button {
  background: var(--card, #172231);
  filter: brightness(1.2);
  color: var(--foreground, #f5f7fa);
  border: 1px solid var(--border, #263243);
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  margin-left: 12px;
  font: inherit;
  transition: all 0.2s;
}
input[type="file"]::file-selector-button:hover {
  background: var(--border, #263243);
}

/* Update progress spinner */
.update-spinner {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 2px solid var(--muted, #9ba6b5);
  border-top-color: var(--primary, #b8f542);
  border-radius: 50%;
  animation: update-spin 0.8s linear infinite;
  flex-shrink: 0;
}
@keyframes update-spin {
  to { transform: rotate(360deg); }
}

.update-step.running .update-step-label {
  color: var(--foreground, #f0f0f0);
  font-weight: 600;
}
.update-step.done .update-step-label {
  color: var(--muted, #9ba6b5);
}
.update-step.error .update-step-label {
  color: #ef4444;
}
.update-step.skipped .update-step-label {
  color: var(--muted, #9ba6b5);
  opacity: 0.7;
}
</style>
<script>
(function() {
  const savedTheme = localStorage.getItem('admin-theme');
  if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();

function toggleAdminTheme() {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  const newTheme = isLight ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('admin-theme', newTheme);
  applyTheme();
}

function applyTheme() {
  fetch('/api/site')
    .then(r => r.json())
    .then(site => {
      const t = site.theme || {};
      const root = document.documentElement;
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      const c = isLight ? (t.light || {}) : (t.dark || {});

      if (c.primary) { root.style.setProperty('--primary', c.primary); }
      else if (t.baseColor) { root.style.setProperty('--primary', t.baseColor); }
      if (c.secondary) root.style.setProperty('--secondary', c.secondary);
      if (c.card) root.style.setProperty('--card', c.card);
      if (c.background) { root.style.setProperty('--background', c.background); document.body.style.background = c.background; }
      if (c.foreground) { root.style.setProperty('--foreground', c.foreground); document.body.style.color = c.foreground; }
      if (c.muted) root.style.setProperty('--muted', c.muted);
      if (c.border) root.style.setProperty('--border', c.border);

      const fonts = site.fonts || [];
      const typo = site.typography || {};
      const bodyFontName = typo.bodyFont || site.font || 'Tahoma';
      const bodyConfig = fonts.find(f => f.name === bodyFontName);

      if (bodyConfig) {
        if (bodyConfig.source === 'google' && bodyConfig.googleFamily) {
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(bodyConfig.googleFamily) + '&display=swap';
          document.head.appendChild(link);
          document.body.style.fontFamily = "'" + bodyFontName + "', Tahoma, Arial, sans-serif";
        } else if (bodyConfig.source === 'custom' && bodyConfig.customFont) {
          const cf = bodyConfig.customFont;
          const range = cf.isVariable && cf.weights && cf.weights.length ? 'font-weight: ' + Math.min(...cf.weights) + ' ' + Math.max(...cf.weights) + ';' : 'font-weight: 400;';
          const face = "@font-face{font-family:'" + bodyConfig.name + "';src:url('" + cf.path + "') format('" + cf.format + "');font-display:swap;" + range + "}";
          const style = document.createElement('style');
          style.innerHTML = face;
          document.head.appendChild(style);
          document.body.style.fontFamily = "'" + bodyFontName + "', Tahoma, Arial, sans-serif";
        } else {
           document.body.style.fontFamily = bodyFontName + ', Tahoma, Arial, sans-serif';
        }
      } else {
        const fc = typeof site.font === 'string' && site.font.startsWith('{') ? JSON.parse(site.font) : { name: site.font || 'Tahoma' };
        if (fc.name) document.body.style.fontFamily = fc.name + ', Tahoma, Arial, sans-serif';
      }
    }).catch(e => console.error(e));
}
document.addEventListener("DOMContentLoaded", applyTheme);
</script>
</head><body><div class="app">
<aside class="sidebar">
  <div class="sidebar-nav">
    <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom: 16px">
      <h1>پنل مدیریت</h1>
      <button class="theme-toggle" onclick="toggleAdminTheme()" title="تغییر قالب">
        <span data-icon='moon' class='icon-moon'></span>
        <span data-icon='sun' class='icon-sun'></span>
      </button>
    </div>

<button class="nav-item active" id="nav-pages" onclick="show('pages')"><span data-icon='pages'></span> برگه‌ها</button>

<div class="nav-group" id="group-projects">
  <button class="nav-group-toggle" onclick="toggleGroup('projects')">
    <span class="nav-group-label"><span data-icon='briefcase'></span> پروژه‌ها</span>
    <span data-icon='arrow_left' class="nav-group-arrow"></span>
  </button>
  <div class="nav-group-children">
    <button class="nav-child" id="nav-projects" onclick="show('projects')">همه پروژه‌ها</button>
    <button class="nav-child" id="nav-categories" onclick="show('categories')">دسته‌ها</button>
  </div>
</div>

<div class="nav-group" id="group-posts">
  <button class="nav-group-toggle" onclick="toggleGroup('posts')">
    <span class="nav-group-label"><span data-icon='posts'></span> بلاگ</span>
    <span data-icon='arrow_left' class="nav-group-arrow"></span>
  </button>
  <div class="nav-group-children">
    <button class="nav-child" id="nav-posts" onclick="show('posts')">همه نوشته‌ها</button>
    <button class="nav-child" id="nav-post-categories" onclick="show('post-categories')">دسته‌ها</button>
  </div>
</div>

<button class="nav-item" id="nav-menu" onclick="show('menu')"><span data-icon='menu'></span> منوی سایت</button>

<button class="nav-item" id="nav-media" onclick="show('media')"><span data-icon='media'></span> رسانه</button>
<div class="nav-group" id="group-settings">
  <button class="nav-group-toggle" onclick="toggleGroup('settings')">
    <span class="nav-group-label"><span data-icon='settings'></span> تنظیمات</span>
    <span data-icon='arrow_left' class="nav-group-arrow"></span>
  </button>
  <div class="nav-group-children">
    <button class="nav-child" id="nav-settings" onclick="show('settings')"><span data-icon='settings_general'></span> عمومی</button>
    <button class="nav-child" id="nav-color-scheme" onclick="show('color-scheme')"><span data-icon='color_scheme'></span> رنگ‌بندی</button>

    <button class="nav-child" id="nav-typography" onclick="show('typography')"><span data-icon='typography'></span> فونت</button>
  </div>
</div>
<button class="nav-item" id="nav-update" onclick="show('update')"><span data-icon='update'></span> بروزرسانی</button>
<hr>
<button class="nav-item" id="nav-preview" onclick="show('preview')"><span data-icon='eye'></span> پیش‌نمایش</button>
<button class="nav-item" onclick="show('publish')"><span data-icon='publish'></span> انتشار</button>
  </div>

</aside>
<main class="main"><div id="content"></div></main>
</div>
<div id="media-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeMediaModal()">
  <div class="modal-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h3 style="margin:0;">انتخاب رسانه</h3>
      <button class="modal-close" style="margin:0; font-size:1.5rem;" onclick="closeMediaModal()">&times;</button>
    </div>
    <div class="row" style="margin-bottom:16px">
      <input type="file" id="media-modal-upload" accept="image/*" style="flex:1">
      <button class="btn" onclick="uploadMediaFromModal()">آپلود</button>
    </div>
    <div class="grid2" id="media-modal-grid" style="max-height:60vh; overflow-y:auto; padding-right:8px;"></div>
    <div style="display:flex; justify-content:space-between; margin-top:16px; align-items:center">
      <button id="media-modal-gallery-btn" class="btn sec" onclick="toggleMediaModalGalleryMode()">حالت گالری</button>
      <div style="display:flex; gap:8px; align-items:center">
        <span id="media-modal-selection-count" style="display:none; color:var(--muted); font-size:0.9rem;"></span>
        <button id="media-modal-confirm-btn" class="btn" onclick="confirmMediaSelection()">افزودن</button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="/js/main.js"></script><script type="module">
  import { icon } from '/js/icons.js';
  document.querySelectorAll('span[data-icon]').forEach(el => {
    const name = el.getAttribute('data-icon');
    const svgStr = icon(name);
    el.outerHTML = svgStr.replace('<svg', `<svg class="${el.className}"`);
  });
</script>
</body></html>
